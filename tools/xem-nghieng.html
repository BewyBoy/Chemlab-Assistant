<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem dáng nghiêng</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#f4ecd8;margin:0;padding:16px;font:14px system-ui;color:#3b3025;overflow:auto;height:auto}
.row{display:flex;gap:6px;align-items:flex-end;border-bottom:1px solid #d8ccb0;padding:8px 0}
.lbl{width:120px;flex:none}
.cell{position:relative;width:160px;height:202px;overflow:hidden;background:#fffdf6;border:1px solid #e3d8bd;border-radius:6px;text-align:center;line-height:0}
.cell svg{height:250px}
.walkdemo .sarm{transform-box:fill-box;transform-origin:50% 4%;animation:armswing .55s ease-in-out infinite alternate}
</style></head><body>
<p>Dáng nghiêng (đi từ phải sang trái) cạnh dáng thẳng — mỗi skin: nghiêng · nghiêng vui · thẳng. Khung cắt đúng như trong game (cao 202px).</p>
<div id="out"></div>
<script src="../js/loi-thoai.js"></script>
<script src="../js/nhan-vat.js"></script>
<script src="../js/phan-ung.js"></script>
<script src="../js/du-lieu.js"></script>
<script src="../js/do-hoa.js"></script>
<script src="../js/trang-phuc.js"></script>
<script src="../js/nhan-vat-skin.js"></script>
<script src="../js/nhan-vat-nghieng.js"></script>
<script>
const out = document.getElementById('out'), only = new URLSearchParams(location.search).get('c');
CUSTOMERS.forEach((c, i) => {
  if(only != null && +only !== i) return;
  let h = `<div class="row"><div class="lbl">${i}. ${c[0]}</div>`;
  for(let k = 0; k < SKIN_COUNT; k++)
    h += `<div class="cell walkdemo">${custSideSVG(i, 'neutral', k)}</div><div class="cell">${custSideSVG(i, 'happy', k)}</div><div class="cell">${custSVG(i, 'neutral', k)}</div>`;
  out.insertAdjacentHTML('beforeend', h + '</div>');
});
</script></body></html>
