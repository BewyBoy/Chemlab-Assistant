<!-- Bản gốc của favicon.png / favicon.ico và icon ứng dụng (desktop/icon.ico): phân tử H₂O kiểu bi–que, cùng màu bi
     trong game (ATOM_STYLE: O đỏ, H trắng; bi H nhỏ hơn bi O), góc liên kết H–O–H 104,5°.
     Sửa ở đây rồi xuất lại: cd desktop && npm run icon (ghi favicon.png 128 px, favicon.ico 16/32/48 px, desktop/icon.ico). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g stroke="#3b3025" stroke-width="5.5" stroke-linecap="round">
    <line x1="32" y1="25.4" x2="10.65" y2="41.93"/>
    <line x1="32" y1="25.4" x2="53.35" y2="41.93"/>
  </g>
  <g stroke="#3b3025" stroke-width="2.6">
    <circle cx="10.65" cy="41.93" r="8.2" fill="#ffffff"/>
    <circle cx="53.35" cy="41.93" r="8.2" fill="#ffffff"/>
    <circle cx="32" cy="25.4" r="11.5" fill="#e0574a"/>
  </g>
  <!-- khối tròn: bi O có đốm sáng góc trên trái; bi H trắng thì có bóng xám mờ ở góc dưới phải -->
  <g fill="#3b3025" opacity=".14">
    <path d="M15.71 37.69 A6.6 6.6 0 0 1 6.41 46.99 A8.4 8.4 0 0 0 15.71 37.69 Z"/>
    <path d="M58.41 37.69 A6.6 6.6 0 0 1 49.11 46.99 A8.4 8.4 0 0 0 58.41 37.69 Z"/>
  </g>
  <ellipse cx="27.97" cy="21.26" rx="3.9" ry="2.5" fill="#fff" opacity=".5" transform="rotate(-35 27.97 21.26)"/>
</svg>
