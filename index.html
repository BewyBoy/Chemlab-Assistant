<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChemLab Assistant – Trợ lý phòng thí nghiệm</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Patrick+Hand&family=Playpen+Sans:wght@400;700&display=swap');
:root{--ink:#3b3025;--paper:#f7f1e3;--card:#fffdf5;--accent:#e8b84b;--red:#d9634f;--green:#7aa95c;--blue:#6f9ec9;--purple:#9b7bb8;
--wood:#c89a63;--wood2:#8a6238;--wood3:#a97c4b;--cork:#d9b98a;
--fh:'Itim','Playpen Sans','Patrick Hand','Segoe Print','Comic Sans MS',cursive;--fb:'Segoe UI','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#4a4238;overflow:hidden;font-family:var(--fb);font-size:15px;color:var(--ink)}
h1,h2,h3,.btn,.hand,.tool,.chem .f,.on-name,.day-card .dn,.hud-title{font-family:var(--fh)}
#game{position:absolute;left:50%;top:50%;width:1280px;height:720px;background:var(--paper);background-image:radial-gradient(#00000010 1.2px,transparent 1.2px);background-size:26px 26px;border:5px solid var(--ink);border-radius:16px;overflow:hidden}
.scene{position:absolute;inset:0;padding:18px}
.ico{vertical-align:-3px}
svg{overflow:visible}
/* ---------- buttons ---------- */
.btn{font-family:var(--fh);font-size:17px;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:12px 14px 11px 13px;padding:8px 18px;cursor:pointer;box-shadow:3px 4px 0 #3b302544;transition:transform .09s,box-shadow .09s}
.btn:hover{transform:translateY(-2px);box-shadow:3px 6px 0 #3b302544}
.btn:active{transform:translateY(2px);box-shadow:1px 1px 0 #3b302544}
.btn.big{font-size:22px;padding:12px 30px;background:var(--accent)}
.btn.warn{background:#f3cfc7}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:3px 4px 0 #3b302522}
.btn:focus-visible{outline:3px dashed var(--blue);outline-offset:2px}
.icobtn{width:42px;height:42px;padding:6px;display:inline-flex;align-items:center;justify-content:center}
h1{font-size:44px;margin:8px 0;text-shadow:2px 2px 0 #e8b84b88}
h2{font-size:26px;margin:6px 0}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
/* ---------- main menu ---------- */
.menu-wall{position:absolute;left:0;right:0;top:0;height:600px;background:linear-gradient(#f3ead6,#efe4cc)}
.menu-sign{position:relative;width:680px;margin:70px auto 0;background:linear-gradient(#d3a86e,#c89a63 55%,#b98a52);border:5px solid var(--ink);border-radius:14px 18px 14px 16px;box-shadow:5px 8px 0 #3b302533;padding:14px 30px 18px;text-align:center;transform:rotate(-.6deg);animation:signdrop .8s cubic-bezier(.3,1.45,.55,1)}
.menu-sign::before,.menu-sign::after{content:'';position:absolute;top:-70px;height:72px;width:6px;background:linear-gradient(#8a6238,#6e5232);border:2px solid var(--ink);border-radius:3px}
.menu-sign::before{left:19%;transform:rotate(-2deg)}.menu-sign::after{right:19%;transform:rotate(2deg)}
.menu-sign h1{font-size:56px;margin:2px 0;text-shadow:2px 3px 0 #e8b84b,3px 4px 0 #3b302533}
.menu-sign h2{font-size:20px;margin:0;opacity:.85;font-weight:normal}
@keyframes signdrop{from{transform:translateY(-180px) rotate(-.6deg)}60%{transform:translateY(10px) rotate(-.6deg)}}
.menu-bubble{position:absolute;bottom:330px;right:44px;width:210px;background:var(--card);border:3px solid var(--ink);border-radius:14px 16px 14px 3px;padding:9px 12px;font-family:var(--fh);font-size:15px;line-height:1.35;box-shadow:3px 4px 0 #3b302533;transform:rotate(1.2deg)}
.menu-bubble::after{content:'';position:absolute;bottom:-14px;right:38px;border:8px solid transparent;border-top:10px solid var(--ink)}
.menu-stats{display:inline-block;margin-top:10px;font-size:13.5px;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:3px 14px;box-shadow:2px 3px 0 #3b302533}
.mbub{position:absolute;border:3px solid var(--ink);border-radius:50%;background:#dbeefc88;opacity:0;animation:mbubrise 7s linear infinite;pointer-events:none}
@keyframes mbubrise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.55}55%{transform:translateY(-160px) translateX(10px)}88%{opacity:.55}100%{transform:translateY(-320px) translateX(-6px);opacity:0}}
/* ---------- world map ---------- */
/* wall-calendar map */
.calsheet{position:relative;max-width:1180px;margin:16px auto 0;background:#fffdf5;border:4px solid var(--ink);border-radius:6px 6px 12px 12px;box-shadow:4px 7px 0 #3b302533;padding:20px 14px 10px}
.calrings{position:absolute;top:-14px;left:30px;right:30px;display:flex;justify-content:space-evenly;pointer-events:none}
.calrings span{width:11px;height:26px;border:3px solid var(--ink);border-radius:6px;background:linear-gradient(#ece4d2,#b8ac94)}
.calhead{text-align:center;font-family:var(--fh);font-size:21px;font-weight:bold;letter-spacing:2px;padding:2px 0 6px;border-bottom:3px solid var(--ink)}
.calhead small{display:block;font-size:11.5px;font-weight:normal;letter-spacing:.4px;opacity:.65;font-family:var(--fb)}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);font-family:var(--fh);font-weight:bold;font-size:13px;text-align:center;padding:5px 0 3px}
.calwd .sun{color:#d9634f}
.map-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
.calnote{grid-column:1/-1;font-size:11px;font-style:italic;opacity:.62;padding:1px 8px;border-right:2px solid var(--ink);border-bottom:2px dashed #3b302555;background:#f6efdc}
.day-card{position:relative;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:3px 7px;min-height:68px;cursor:pointer;transition:background .12s}
.day-card:hover{background:#f7edd2}
.day-card.locked{background:#e9e2d0;opacity:.5;cursor:default}
.day-card.blank{background:repeating-linear-gradient(-45deg,#f2ecd9 0 8px,#ece4cc 8px 16px);cursor:default;opacity:.55}
.day-card.blank:hover{background:repeating-linear-gradient(-45deg,#f2ecd9 0 8px,#ece4cc 8px 16px)}
.day-card .dn{font-size:21px;font-weight:bold;line-height:1.05}
.day-card.sun .dn{color:#d9634f}
.day-card .dt{font-size:10.5px;line-height:1.18;max-height:38px;overflow:hidden}
.day-card .st{position:absolute;right:6px;bottom:2px;font-size:13px;color:#c99a1e;letter-spacing:1px}
/* red pen circle drawn around the number when picking an unplayed day */
.dnw{position:relative;display:inline-block;min-width:22px}
.dnc{position:absolute;left:-11px;top:-7px;width:46px;height:38px;overflow:visible;pointer-events:none}
.dnc path{fill:none;stroke:#d9634f;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:.9}
.day-card.circled .dnc path{animation:dcirc .45s ease-out forwards}
@keyframes dcirc{to{stroke-dashoffset:0}}
/* ---------- wooden HUD sign board ---------- */
.hudboard{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:14px;padding:8px 16px;z-index:20;
background:linear-gradient(#c89a63,#b98a52 55%,#a97c4b);border-bottom:5px solid var(--ink);box-shadow:0 4px 0 #00000022}
.hudboard::before,.hudboard::after{content:'';position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:#6e5232;border:2px solid var(--ink)}
.hudboard::before{left:12px}.hudboard::after{right:12px}
.hud-title{font-size:19px;font-weight:bold;text-shadow:1px 1px 0 #ffffff55;white-space:nowrap}
.hud-grain{position:absolute;inset:0;pointer-events:none;opacity:.5}
.timerbar{flex:1;height:20px;border:3px solid var(--ink);border-radius:10px;background:var(--card);overflow:hidden;min-width:120px}
.timerbar>div{height:100%;background:var(--green);transition:width 1s linear,background 1s}
.hudstat{font-family:var(--fh);font-size:16px;font-weight:bold;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;white-space:nowrap}
/* ---------- lab room ---------- */
.wall{position:absolute;left:0;right:300px;top:64px;height:388px;background:linear-gradient(#f3ead6,#efe4cc);border-bottom:0}
.wallitem{position:absolute}
.bench-top{position:absolute;left:336px;right:300px;top:436px;height:34px;background:linear-gradient(#d3a86e,#c89a63);border:4px solid var(--ink);border-radius:8px 8px 0 0;z-index:2}
.bench-front{position:absolute;left:336px;right:300px;top:468px;bottom:0;background:linear-gradient(#b98a52,#a97c4b);border-left:4px solid var(--ink);border-right:4px solid var(--ink);z-index:1}
.benchtex{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* customer column */
.custcol{position:absolute;left:8px;top:70px;width:326px;bottom:8px;z-index:5}
.corkstrip{position:relative;height:186px;border:4px solid var(--ink);border-radius:10px;background:var(--cork);box-shadow:inset 0 0 0 6px #c8a06a55;padding:10px}
.corktex{position:absolute;inset:0;border-radius:6px;pointer-events:none;opacity:.7}
.ordernote{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:3px 6px 4px 5px;padding:8px 10px 6px;height:100%;box-shadow:2px 3px 4px #3b302533;transform:rotate(-.8deg)}
.ordernote::before{content:'';position:absolute;top:-11px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--red);border:2.5px solid var(--ink);box-shadow:1px 2px 2px #00000044}
.ordernote.pulse{animation:notepulse 1s infinite}
@keyframes notepulse{50%{box-shadow:0 0 0 5px #d9634f55,2px 3px 4px #3b302533}}
.on-head{display:flex;gap:8px;align-items:center}
.on-face{width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;overflow:hidden;flex:none}
.on-face svg{width:100%;height:100%}
.on-cname{font-family:var(--fh);font-weight:bold;font-size:14px}
.on-job{display:block;font-family:var(--fb);font-weight:normal;font-size:11px;opacity:.65;line-height:1.1}
.on-name{font-size:16.5px;font-weight:bold;line-height:1.2;margin-top:4px}
.on-meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:14px}
.on-swatch{width:20px;height:20px;border:2.5px solid var(--ink);border-radius:6px;flex:none}
.on-ring{margin-left:auto}
.on-ring circle.bg{fill:none;stroke:#3b302522;stroke-width:4}
.on-ring circle.fg{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear,stroke 1s}
.speech{position:relative;border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:8px 12px;font-size:14.5px;margin-top:14px;min-height:64px;font-family:var(--fh);line-height:1.3}
.speech::before{content:'';position:absolute;bottom:-16px;left:46px;border:8px solid transparent;border-top-color:var(--ink)}
.custzone{position:relative;flex:1;cursor:pointer;text-align:center;margin-top:2px}
.custzone:hover .charsvg{transform:translateY(-3px)}
.custzone .charsvg{height:300px;transition:transform .15s;filter:drop-shadow(3px 5px 2px #3b302522)}
.custzone.shaken{animation:shake .3s 2}
.cust-nametag{font-family:var(--fh);font-weight:bold;font-size:15px;margin-top:-6px}
.queue{font-size:13px;opacity:.75;margin-top:2px}
.servehint{margin-top:4px;font-size:12.5px;background:#fdf3d7;border:2px dashed var(--ink);border-radius:8px;padding:4px 8px}
/* characters: blink + expressions */
.charsvg .x-neutral,.charsvg .x-happy,.charsvg .x-annoy{display:none}
.charsvg[data-exp="neutral"] .x-neutral{display:inline}
.charsvg[data-exp="happy"] .x-happy{display:inline}
.charsvg[data-exp="annoy"] .x-annoy{display:inline}
.blinklid{transform:scaleY(0);transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
/* bench stations */
.benchzone{position:absolute;z-index:6}
.beakerzone{left:452px;top:196px;width:236px;height:300px;cursor:pointer;transition:top .45s cubic-bezier(.3,1.4,.5,1)}
.beakerzone.sel{outline:4px dashed var(--blue);outline-offset:6px;border-radius:12px}
.beakerzone.glowing{animation:glow 1s}
.beakerzone.hot{top:146px;animation:shimmer 1.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px #ffb347)}}
@keyframes shimmer{0%,100%{transform:skewX(0)}25%{transform:skewX(.5deg) translateY(-1px)}75%{transform:skewX(-.5deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shaken{animation:shake .3s 2}
.lampzone{left:395px;top:352px;width:78px;height:96px;z-index:7;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s}
.lampzone.docked{left:531px;top:406px}
.eleczone{left:305px;top:250px;width:74px;height:84px;z-index:7;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s}
.eleczone.docked{left:530px;top:170px}
.beakerzone.hot ~ .eleczone.docked{top:120px}
.dishzone{left:812px;top:446px;width:64px;height:30px;z-index:7}
.dishzone .dish{margin:0}
/* drag & drop */
.dragghost{position:absolute;z-index:85;pointer-events:none;filter:drop-shadow(5px 12px 8px #3b302555);will-change:left,top,transform}
.dragghost svg{display:block}
.draggingsrc{opacity:.45}
.dropready{outline:4px dashed var(--blue);outline-offset:6px;border-radius:14px;animation:dzpulse 1s infinite}
@keyframes dzpulse{50%{outline-color:var(--accent);outline-offset:10px}}
.gaszone{left:706px;top:330px;width:92px;height:132px;transition:transform .4s,left .4s,top .4s}
.gaszone.catching{transform:translate(-118px,-160px) rotate(180deg)}
.beakerzone.hot ~ .gaszone.catching{transform:translate(-118px,-210px) rotate(180deg)}
.funnelzone{left:806px;top:344px;width:78px;height:110px}
.dressing{left:350px;top:352px;width:150px;height:96px;pointer-events:none;opacity:.95}
.dressing2{left:412px;top:368px;width:58px;height:78px;pointer-events:none}
.sinkzone{left:884px;top:368px;width:92px;height:78px}
.rodzone{left:700px;top:310px;width:32px;height:142px;z-index:7}
.rodzone:hover{transform:translateY(-3px)}
/* dissolve/reaction progress ring over the beaker — slow fill while stirring, quick flash on instant reactions */
.stirring-ring{position:absolute;left:604px;top:174px;width:52px;height:52px;z-index:11;pointer-events:none;opacity:0;transition:opacity .25s,top .45s cubic-bezier(.3,1.4,.5,1)}
.beakerzone.hot ~ .stirring-ring{top:124px}
.stirring-ring.active,.stirring-ring.flash{opacity:1}
.stirring-ring circle.bg{fill:none;stroke:#3b302522;stroke-width:5}
.stirring-ring circle.fg{fill:none;stroke:#6f9ec9;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;stroke-dasharray:132;transition:stroke-dashoffset .3s ease-out}
.stirring-ring.flash circle.fg{animation:rxnflash .7s ease-out forwards}
@keyframes rxnflash{0%{stroke-dashoffset:132;stroke:var(--green);opacity:1}30%{stroke-dashoffset:0;stroke:var(--green);opacity:1}100%{stroke-dashoffset:0;opacity:0}}
/* readout strip on bench front */
.readout{display:none}
.readout::before{content:'';position:absolute;top:-9px;left:40px;width:44px;height:15px;background:#e8dfa8aa;border:1.5px solid #3b302544;transform:rotate(-4deg)}
.mixinfo{display:flex;flex-wrap:wrap;gap:4px;min-height:26px}
.chip{border:2px solid var(--ink);border-radius:9px;background:#fff;font-size:12.5px;padding:0 7px}
.chip.pc{background:#efe7da}
.rlog{margin-top:4px;font-size:13px;min-height:40px;line-height:1.4}
.rlog .rl{background:#fdf3d7;border-radius:8px;padding:0 7px;display:inline-block;margin:1px}
/* toolbar */
.toolbar{display:none}
.tool{border:3px solid var(--ink);border-radius:10px;background:var(--card);padding:3px 6px;font-size:12px;cursor:pointer;text-align:center;box-shadow:2px 3px 0 #3b302533;transition:transform .09s;width:66px}
.tool svg{display:block;margin:0 auto}
.tool:hover{transform:translateY(-3px)}
.tool:active{transform:translateY(1px)}
.tool.on{background:var(--accent)}
.vial{border:3px solid var(--ink);border-radius:10px;background:var(--card);padding:3px 6px;font-size:11.5px;cursor:pointer;text-align:center;min-width:92px;transition:transform .09s}
.vial:hover{transform:translateY(-3px)}
.vial.sel{outline:4px dashed var(--blue)}
.dish{width:54px;height:16px;border:3px solid var(--ink);border-radius:0 0 16px 16px;margin:6px auto 2px;background:#fff}
.mgbtn{font-family:var(--fb);font-size:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;padding:1px 6px}
.mgbtn:hover{background:var(--accent)}
.mgbtn:active{transform:translateY(1px)}
.mgbtn.picked{background:#c9e3b4}
/* shelf */
.shelf{position:absolute;right:8px;top:70px;width:288px;bottom:8px;border:5px solid var(--ink);border-radius:12px;padding:8px;background:linear-gradient(#a97c4b,#8a6238);overflow-y:auto;z-index:10;box-shadow:inset 0 0 0 5px #6e523266,inset 0 0 22px #00000033}
.shelf h3{margin:0 -8px 10px;font-size:16px;font-family:var(--fh);text-align:center;background:linear-gradient(#c89a63,#a97c4b);border-bottom:3px solid var(--ink);padding:4px;text-shadow:1px 1px 0 #ffffff44}
.shgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 8px;padding:6px 4px 12px}
/* item stands directly on a wooden shelf ledge; label is a tag above it */
.chem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:grab;padding:0 2px 11px;background:none;border:none;box-shadow:none;transition:transform .1s}
.chem::after{content:'';position:absolute;left:-4px;right:-4px;bottom:0;height:9px;background:linear-gradient(#c89a63,#6e5232);border:2px solid var(--ink);border-radius:2px;box-shadow:0 3px 5px #00000040;pointer-events:none}
.chem:hover .cc-tag{transform:translateY(-4px) rotate(-1.5deg)}
.cc-tag{transition:transform .12s}
.chem:active{transform:translateY(0) scale(.97)}
.chem svg{display:block;margin:0 auto;filter:drop-shadow(1px 3px 2px #3b302540)}
.cc-tag{position:relative;display:flex;flex-direction:column;align-items:center;max-width:90px;margin-bottom:4px;padding:4px 5px 2px;background:#fffdf5;border:2px solid var(--ink);border-radius:3px;box-shadow:1px 2px 0 #3b302544;overflow:hidden}
.cc-tag::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--stripe,#e8b84b)}
.cc-tag .f{font-weight:bold;font-size:14px;line-height:1.1}
.cc-tag .nm{font-size:8px;line-height:1.05;max-height:19px;overflow:hidden;opacity:.8;font-family:var(--fb);text-align:center}
/* fact bubble shown after hovering a chemical for 5s */
.chemfact{position:absolute;left:50%;bottom:calc(100% - 8px);transform:translateX(-50%);width:150px;background:#fffdf5;border:2.5px solid var(--ink);border-radius:10px 12px 10px 11px;padding:7px 9px;font-family:var(--fb);font-size:11.5px;line-height:1.34;color:var(--ink);box-shadow:2px 3px 0 #3b302533;z-index:32;pointer-events:none;animation:factpop .28s ease-out}
.chemfact::after{content:'';position:absolute;left:var(--arrow,50%);bottom:-9px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink)}
.chemfact b{display:block;font-family:var(--fh);font-size:11px;margin-bottom:2px;color:#b8832a}
@keyframes factpop{from{opacity:0}to{opacity:1}}
/* ---------- modal / toast ---------- */
.overlay{position:absolute;inset:0;background:#3b302588;display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:var(--card);border:4px solid var(--ink);border-radius:16px;padding:18px 24px;max-width:780px;max-height:620px;overflow-y:auto;box-shadow:6px 8px 0 #00000033}
.modal h2{margin-top:0}
.eq{font-size:16px;padding:3px 6px;border-bottom:1px dashed #3b302555}
.toast{position:absolute;left:20px;bottom:20px;background:#3b3025;color:#f7f1e3;border-radius:12px;padding:10px 16px;font-size:15.5px;z-index:60;animation:tpop 3.5s forwards;max-width:520px}
@keyframes tpop{0%{transform:translateY(60px);opacity:0}10%,85%{transform:none;opacity:1}100%{opacity:0}}
.condlist{text-align:left;display:inline-block;font-size:15.5px;line-height:1.7}
.paper{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:14px 20px;box-shadow:4px 5px 0 #3b302533}
.sealrow{position:relative;display:flex;gap:10px;align-items:center;background:var(--card);border:2.5px solid var(--ink);border-radius:6px 9px 7px 8px;padding:7px 10px 7px 14px;margin:7px 0;box-shadow:2px 3px 0 #3b302522}
.seal{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#e58876,#c14b38 70%);border:2px solid #8f3526;display:flex;align-items:center;justify-content:center;box-shadow:1px 2px 2px #00000033}
.sealrow.off{opacity:.5}

.bin{border:4px solid var(--ink);border-radius:0 0 18px 18px;border-top:none;background:#efe7da;width:190px;height:130px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:bold;cursor:pointer;font-family:var(--fh)}
.bin:hover{background:var(--accent)}
.flash-ok{animation:fok .5s}
@keyframes fok{50%{background:#c9e3b4}}
.flash-bad{animation:fbad .5s}
@keyframes fbad{50%{background:#f3b8ac}}
.mgbottles{display:flex;gap:18px}
.mgbottle{text-align:center;width:130px}
.mgbottle .bo{cursor:pointer;transition:transform .1s}
.mgbottle .bo:hover{transform:translateY(-3px)}
.strip{height:26px;width:16px;margin:4px auto;border:2px solid var(--ink);border-radius:4px;background:#cbb7e0;transition:background .3s}
.mgbtnrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.obsgrid{border-collapse:collapse;font-size:14.5px}
.obsgrid td,.obsgrid th{border:2px solid var(--ink);padding:5px 9px;background:#fff}
.obsgrid td.o{cursor:pointer;background:#fdf3d7;min-width:110px;text-align:center}
.seqslot{display:inline-block;border:3px dashed var(--ink);border-radius:10px;min-width:56px;height:44px;margin:3px;font-size:20px;font-weight:bold;line-height:40px;background:#fff;font-family:var(--fh);text-align:center}
.seqslot.filled{border-style:solid;background:#c9e3b4}
.devbadge{position:absolute;right:16px;top:10px;font-size:12px;background:#d9634f;color:#fff;border-radius:8px;padding:2px 8px;z-index:50}

/* ---- formatting helpers ---- */
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = f => f.replace(/([A-Za-z)])(\d+)/g, (m,ch,d) => ch + [...d].map(x=>SUBS[+x]).join(''));
const amt = n => (+(n/10).toFixed(3)).toString().replace('.',',') + ' mol'; // doses can be fractional (0,05 mol...)
function eqStr(r){ // auto-build balanced equation string with ↑/↓ markers
  const side = (obj, mark) => Object.keys(obj).map(f=>{
    let m = '';
    if(mark){ if(CHEMS[f].s==='k') m='↑'; else if(isPrecip(f)) m='↓'; }
    return (obj[f]>1? obj[f]:'') + sub(f) + m;
  }).join(' + ');
  return side(r.rg) + ' —' + (r.heat?'t°':'') + '→ ' + side(r.pr, true);
}
function fxOf(r){ // visual effect summary for a reaction
  const fx = [];
  if(Object.keys(r.pr).some(f=>CHEMS[f].s==='k')) fx.push('sủi bọt khí');
  if(Object.keys(r.pr).some(isPrecip)) fx.push('kết tủa');
  if(r.exo) fx.push('toả nhiệt');
  return fx.join(', ');
}

/* ---- synthesized sound effects (WebAudio, no files) ---- */
const SFX = (() => {
  let ctx = null;
  let muted = localStorage.getItem('chemlab_mute') === '1';
  const ac = () => {
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(f, d, type, v, f2){
    const c = ac(); if(!c || muted) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.value = f;
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime+d);
    g.gain.setValueAtTime(v||.1, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+d);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+d+.02);
  }
  function noise(d, v, fq, q){
    const c = ac(); if(!c || muted) return;
    const n = Math.floor(c.sampleRate*d), b = c.createBuffer(1, n, c.sampleRate), ch = b.getChannelData(0);
    for(let i=0;i<n;i++) ch[i] = (Math.random()*2-1)*(1-i/n);
    const s = c.createBufferSource(); s.buffer = b;
    const fl = c.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=fq||1200; fl.Q.value=q||1;
    const g = c.createGain(); g.gain.value = v||.08;
    s.connect(fl); fl.connect(g); g.connect(c.destination); s.start();
  }
  return {
    isMuted: () => muted,
    toggle(){ muted = !muted; localStorage.setItem('chemlab_mute', muted?'1':'0'); return muted; },
    pour(){ noise(.35,.11,700,.8); },
    grain(){ noise(.28,.1,2600,1.6); },
    fizz(){ for(let i=0;i<4;i++) setTimeout(()=>noise(.12,.05,3200,2), i*70); },
    clink(){ tone(1900,.09,'triangle',.08); setTimeout(()=>tone(2600,.12,'triangle',.05),40); },
    coin(){ tone(988,.08,'square',.045); setTimeout(()=>tone(1319,.16,'square',.045),70); },
    bell(){ tone(880,.25,'sine',.08); setTimeout(()=>tone(1175,.3,'sine',.07),140); },
    page(){ noise(.26,.06,900,.6); },
    stamp(){ noise(.09,.13,300,1); tone(140,.12,'sine',.11,90); },
    err(){ tone(320,.18,'sawtooth',.05,180); },
    splash(){ noise(.3,.1,500,.7); setTimeout(()=>noise(.15,.05,900,.8),100); }
  };
})();

/* ---- page-turn scene transition ---- */
function go(fn){
  SFX.page();
  const w = document.createElement('div'); w.className = 'pagewipe';
  G.appendChild(w);
  setTimeout(()=>{
    const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
    Object.defineProperty(G, 'innerHTML', {
      get() { return desc.get.call(G); },
      set(html) {
        Array.from(G.childNodes).forEach(c => {
          if (c !== w) G.removeChild(c);
        });
        const temp = document.createElement('div');
        temp.innerHTML = html;
        while (temp.firstChild) {
          G.insertBefore(temp.firstChild, w);
        }
      },
      configurable: true
    });
    try {
      fn();
    } finally {
      delete G.innerHTML;
    }
  }, 290);
  setTimeout(()=>w.remove(), 660);
}

/* =====================  RESULT & GRADING  ===================== */
const SPLAT = '<svg class="inksplat" width="240" height="96" viewBox="0 0 240 96"><path fill="#3b3025" d="M22,50 q8,-28 44,-24 q18,-18 46,-9 q30,-14 52,4 q38,-2 44,24 q-12,30 -46,24 q-24,16 -52,6 q-32,12 -52,-5 q-32,6 -36,-20 z"/></svg>';
function showResult(i, st){
  const day = DAYS[i], num = i+1;
  let stars = 0, detail = '';
  if(day.mg){
    const r = st.total ? st.correct/st.total : 0;
    stars = r >= 1 ? 3 : r >= .75 ? 2 : r >= .5 ? 1 : 0;
    detail = `<p style="font-size:18px">Trả lời đúng: <b>${st.correct}/${st.total}</b></p>`;
  } else {
    const all = day.orders.length;
    const perfect = st.wrong === 0;
    if(st.served >= day.s1) stars = 1;
    if(st.served === all) stars = 2;
    if(stars === 2 && perfect) stars = 3;
    detail = `<p style="font-size:16px">Đơn hoàn thành: <b>${st.served}/${all}</b> · Giao sai: <b>${st.wrong}</b></p>`;
    save.served += st.served;
    if(st.served === all) unlockAch('clean');
  }
  const conds = starConds(day).map((c,k)=>'<div>'+ico(stars>k?'check':'close',15)+' '+ico('star',14).repeat(k+1)+' '+c+'</div>').join('');
  // save progress
  const prev = save.stars[num] || 0;
  if(stars > prev) save.stars[num] = stars;
  if(stars >= 1 && num >= save.unlocked && num < DAYS.length) save.unlocked = num + 1;
  persist();
  // achievements
  if(num === 1 && stars >= 1) unlockAch('d1');
  if(stars === 3) unlockAch('star3');
  if(save.served >= 10) unlockAch('serve10');
  if(save.served >= 50) unlockAch('serve50');
  for(let w=0; w<4; w++){
    let ok = true;
    for(let d=w*7+1; d<=w*7+7; d++) if((save.stars[d]||0) < 3) ok = false;
    if(ok) unlockAch('week'+(w+1));
  }
  if(Object.keys(save.stars).filter(k=>save.stars[k]>=1).length >= 28) unlockAch('all28');
  if(num === 28 && stars === 3) unlockAch('master');
  persist();
  const cheer = stars===3?'Xuất sắc! Không chê vào đâu được!':stars===2?'Làm tốt lắm, gần hoàn hảo rồi!':stars===1?'Ổn đấy! Luyện thêm chút nữa nhé.':'Đừng nản — thử lại nào, ta tin trò!';
  const stamps = [0,1,2].map(k=>'<span class="starstamp" id="stamp'+k+'">'+ico('star',68)+'</span>').join('');
  G.innerHTML = `<div class="scene center" style="padding-top:40px">
    <h2>Ngày ${num} kết thúc</h2>
    <div class="stamprow">${SPLAT}${stamps}</div>
    <div class="paper" style="max-width:620px;margin:6px auto">
      ${detail}<div class="condlist">${conds}</div>
      <div class="row" style="margin-top:8px"><div id="resprof"></div>
        <p class="hand" style="text-align:left">“${cheer}”</p></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn" id="bretry">${ico('retry')} Chơi lại</button>
      <button class="btn" id="bmap">${ico('map')} Bản đồ</button>
      ${(stars>=1 && num<DAYS.length)?'<button class="btn big" id="bnext">Ngày tiếp theo '+ico('next')+'</button>':''}
    </div></div>`;
  G.querySelector('#resprof').innerHTML = profSVG(stars>=2?'happy':stars>=1?'neutral':'annoy').replace('viewBox','height="120" viewBox');
  const splatEl = G.querySelector('.inksplat');
  if(stars > 0) splatEl.classList.add('go');
  for(let k=0;k<3;k++){
    const el = G.querySelector('#stamp'+k);
    if(k < stars) setTimeout(()=>{ el.classList.add('go'); SFX.stamp(); }, 380+k*450);
    else setTimeout(()=>el.classList.add('off'), 380+stars*450);
  }
  G.querySelector('#bretry').onclick = () => go(()=>showIntro(i));
  G.querySelector('#bmap').onclick = () => go(showMap);
  const bn = G.querySelector('#bnext');
  if(bn) bn.onclick = () => go(()=>showIntro(i+1));
}

let lab = null;
const tot = obj => Object.values(obj).reduce((a,b)=>a+b,0);

function dayReactions(day){ // reachable reactions for the notebook (closure over shelf chems)
  const have = new Set(day.chems);
  const out = []; let grew = true;
  while(grew){ grew = false;
    for(const r of REACTIONS){
      if(out.includes(r)) continue;
      if(Object.keys(r.rg).every(f=>have.has(f))){
        out.push(r);
        Object.keys(r.pr).forEach(f=>{ if(!have.has(f)){ have.add(f); grew = true; } });
      }
    }
  }
  return out;
}

/* container art per chemical state */
const TRAY_METALS = ['Fe','Cu','Zn','Mg','Al','Ag'];
function contSym(f){
  const c = CHEMS[f];
  if(f === 'Na') return 'sym-metal-na';
  if(TRAY_METALS.includes(f)) return 'sym-metal-' + f.toLowerCase();
  if(c.s === 'k') return 'sym-canister';
  if(c.s === 'd' || c.s === 'l') return 'sym-bottle-liquid';
  return 'sym-jar-powder';
}
// Drag-ghost under the cursor: spoon of powder for solids, pipette of liquid for solutions;
// metals & gas keep their container (a spoonful of sodium / a pipette of gas makes no sense).
function chemDragTool(f){
  const cs = contSym(f), col = CHEMS[f].c;
  if(cs === 'sym-jar-powder')    return {html: sym('sym-spoon',80,80,'--lc:'+col+';--spop:1'), w:80, h:80};
  if(cs === 'sym-bottle-liquid') return {html: sym('sym-pipette',42,150,'--lc:'+col),        w:42, h:150};
  return {html: sym(cs,58,80,'--lc:'+col+';--lc2:#00000022'), w:58, h:80};
}
function stripeCol(f){
  const c = CHEMS[f];
  if(c.a) return '#d9634f';
  if(c.b) return '#6f9ec9';
  if(f === 'Na' || TRAY_METALS.includes(f)) return '#8a8d90';
  if(c.s === 'k') return '#f2efe6';
  if(c.s === 'r' && c.sol) return '#e8b84b';
  return '#c9bfa8';
}

/* =====================  DRAG & DROP MANAGER  ===================== */
// types: chem (cabinet bottle), beaker, gas (collection bottle), dish (filtered solids),
// lamp (heater), funnel (filter), mgcard (minigame cards via opts.onDrop)
const DZ_ACCEPT = {
  rod:   [], // never dropped — stirring happens during the drag, then it snaps home
  chem:  ['beaker'],
  beaker:['cust','sink'],
  gas:   ['beaker','cust','sink'],
  dish:  ['cust','sink'],
  lamp:  ['beaker'],
  elec:  ['beaker'],
  funnel:['beaker'],
  mgcard:['bin0','bin1','bin2','bin3']
};
let drag = null;
function gameXY(e){
  const r = G.getBoundingClientRect(), s = r.width/1280;
  return {x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s};
}
function dragify(el, type, opts){
  el.style.touchAction = 'none';
  el.style.cursor = 'grab';
  el.addEventListener('pointerdown', e => {
    if(e.button !== 0 || drag) return;
    if(lab && lab.timer === null) return; // paused
    const p = gameXY(e);
    drag = {type, el, opts, sx:p.x, sy:p.y, x:p.x, y:p.y, tilt:0, ghost:null};
    e.preventDefault();
  });
}
function dragMove(e){
  if(!drag) return;
  const p = gameXY(e);
  if(!drag.ghost){
    if(Math.hypot(p.x-drag.sx, p.y-drag.sy) < 7) return; // click vs drag threshold
    const g = document.createElement('div');
    g.className = 'dragghost';
    g.innerHTML = drag.opts.ghostHTML();
    G.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('draggingsrc');
    (DZ_ACCEPT[drag.type]||[]).forEach(z => {
      const t = G.querySelector('[data-dz="'+z+'"]');
      if(t) t.classList.add('dropready');
    });
    SFX.clink();
  }
  const dx = p.x - drag.x, dist = Math.hypot(dx, p.y - drag.y);
  drag.x = p.x; drag.y = p.y;
  drag.tilt = Math.max(-12, Math.min(12, drag.tilt*.75 + dx*.7)); // lag/tilt follow
  if(drag.type === 'rod') stirMove(p, dist);
  drag.ghost.style.left = (p.x - drag.opts.w/2) + 'px';
  drag.ghost.style.top  = (p.y - drag.opts.h/2) + 'px';
  drag.ghost.style.transform = 'rotate('+drag.tilt.toFixed(1)+'deg) scale(1.05)';
}
function dragEnd(e){
  if(!drag) return;
  const d = drag; drag = null;
  G.querySelectorAll('.dropready').forEach(t => t.classList.remove('dropready'));
  d.el.classList.remove('draggingsrc');
  if(!d.ghost){ if(d.opts.onClick) d.opts.onClick(); return; }
  const g = d.ghost;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const zEl = hit && hit.closest ? hit.closest('[data-dz]') : null;
  const zname = zEl ? zEl.dataset.dz : null;
  if(zname && (DZ_ACCEPT[d.type]||[]).includes(zname)){
    g.remove();
    if(d.opts.onDrop) d.opts.onDrop(zname);
    else dropAction(d.type, zname, d.opts.data);
  } else {
    if(d.opts.onLoose && d.opts.onLoose()){ g.remove(); return; } // e.g. undocking lamp/gas
    g.style.transition = 'left .38s cubic-bezier(.3,1.5,.5,1), top .38s cubic-bezier(.3,1.5,.5,1), transform .38s';
    g.style.left = (d.sx - d.opts.w/2) + 'px';
    g.style.top  = (d.sy - d.opts.h/2) + 'px';
    g.style.transform = 'rotate(0deg) scale(1)';
    setTimeout(()=>g.remove(), 400);
  }
}
addEventListener('pointermove', dragMove);
addEventListener('pointerup', dragEnd);
addEventListener('pointercancel', () => {
  if(!drag) return;
  if(drag.ghost) drag.ghost.remove();
  drag.el.classList.remove('draggingsrc');
  G.querySelectorAll('.dropready').forEach(t => t.classList.remove('dropready'));
  drag = null;
});
function svgClone(sel, w, h){
  const el = G.querySelector(sel);
  return el.outerHTML.replace(/width="\d+"/, 'width="'+w+'"').replace(/height="\d+"/, 'height="'+h+'"');
}
function dropAction(type, zone, data){
  if(!lab) return;
  if(type === 'chem'){ addChem(data); return; }
  if(type === 'beaker'){
    if(zone === 'cust'){ lab.sel = 'beaker'; serve(); } else dumpBeaker();
    return;
  }
  if(type === 'gas'){
    if(zone === 'beaker'){
      if(tot(lab.gas) > 0){
        pourGas();
      } else {
        if(!lab.catcher) setCatch(true);
      }
    }
    else if(zone === 'cust'){ lab.sel = 'gas'; serve(); }
    else { lab.gas = {}; SFX.splash(); toast('Đã xả bình khí vào bồn.'); updateBeaker(); }
    return;
  }
  if(type === 'dish'){
    if(zone === 'cust'){ lab.sel = 'solid'; serve(); }
    else { lab.solid = {}; SFX.splash(); toast('Đã đổ đĩa lọc vào bồn.'); updateBeaker(); }
    return;
  }
  if(type === 'lamp'){ setHeat(true); return; }
  if(type === 'elec'){ setElec(true); return; }
  if(type === 'funnel'){ useFilter(); return; }
}

function startLab(i){
  const day = DAYS[i];
  lab = {i, day, mix:{}, undissolved:{}, dissolveTotal:0, gas:{}, solid:{}, heaterOn:false, elecOn:false, catcher:false, sel:'beaker',
         time:day.dur, oi:0, served:0, wrong:0, waste:0, timer:null, lastColor:'', magicDose:1};
  renderLab();
  lab.timer = setInterval(labTick, 1000);
}

/* ---- free-play (post day 28): full shelf, endless random campaign orders ---- */
function startFree(){
  const labDays = DAYS.filter(d => !d.mg);
  const chems = [...new Set(labDays.flatMap(d => d.chems))];
  const pool = labDays.flatMap(d => d.orders);
  // ponytail: orders sampled from the 28-day campaign — always solvable with the union shelf
  const freeOrder = () => { const od = Object.assign({}, pick(pool)); delete od.line; return od; };
  const day = {t:'Chế độ tự do', free:true, freeOrder, chems,
               tools:['spoon','quy','book','gas','heat','filter','elec'],
               dur:540, s1:0, orders:Array.from({length:6}, freeOrder)};
  lab = {i:-1, day, mix:{}, undissolved:{}, dissolveTotal:0, gas:{}, solid:{}, heaterOn:false, elecOn:false, catcher:false, sel:'beaker',
         time:day.dur, oi:0, served:0, wrong:0, waste:0, timer:null, lastColor:'', magicDose:1};
  renderLab();
  lab.timer = setInterval(labTick, 1000);
  toast('Kệ mở toàn bộ '+chems.length+' hoá chất — khách đến vô tận, nghịch thoải mái!');
}
function finishLab(){
  if(!lab) return; // serve-timeout and timer can race — first one wins
  clearInterval(lab.timer);
  const i = lab.i, st = {served:lab.served, wrong:lab.wrong, waste:lab.waste};
  lab = null;
  go(()=>showResult(i, st));
}

function lerpHex(a, b, t){
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b);
  const c = v => Math.round(v).toString(16).padStart(2,'0');
  return '#' + c(r1+(r2-r1)*t) + c(g1+(g2-g1)*t) + c(b1+(b2-b1)*t);
}

function labTick(){
  lab.time--;
  const frac = lab.time/lab.day.dur, p = 1-frac;
  const bar = G.querySelector('.timerbar>div');
  if(bar){ bar.style.width = (frac*100)+'%'; bar.style.background = frac>.5?'var(--green)':frac>.2?'var(--accent)':'var(--red)'; }
  const tl = G.querySelector('#tleft');
  if(tl) tl.textContent = Math.floor(lab.time/60)+':'+String(lab.time%60).padStart(2,'0');
  // countdown ring on the order note
  const ring = G.querySelector('.on-ring circle.fg');
  if(ring){ ring.style.strokeDashoffset = 88*p; ring.style.stroke = frac>.2?'var(--green)':'var(--red)'; }
  const note = G.querySelector('.ordernote');
  if(note) note.classList.toggle('pulse', frac <= .2);
  // wall clock (8:00 -> 17:00) and window daylight
  const hours = 8 + 9*p;
  const wallw = G.querySelector('#winsvg');
  if(wallw){
    wallw.style.setProperty('--sky', p<.5 ? lerpHex('#bfe3f2','#cfe9f7',p*2) : lerpHex('#cfe9f7','#f0b871',(p-.5)*2));
    wallw.style.setProperty('--sun', lerpHex('#e8b84b','#d9634f',p));
  }
  const ck = G.querySelector('#clocksvg');
  if(ck){ ck.style.setProperty('--ckh', ((hours%12)*30)+'deg'); ck.style.setProperty('--ckm', ((hours*60)%60*6)+'deg'); }
  if(lab.heaterOn || lab.elecOn) runReactions();
  if(lab.time <= 0){ if(lab.day.free) lab.time = lab.day.dur; else finishLab(); } // free play: the day just starts over
}

// hovering a shelf chemical for 5s reveals a fun fact about it
function factHover(el, f){
  const fact = CHEM_FACTS[f]; if(!fact) return;
  let timer = null, bub = null;
  const clear = () => { if(timer) clearTimeout(timer); timer = null; if(bub){ bub.remove(); bub = null; } };
  el.addEventListener('mouseenter', () => {
    clear();
    timer = setTimeout(() => {
      // append to #game root (the shelf scrolls/clips) and position in 1280x720 game coords
      const gr = G.getBoundingClientRect(), cr = el.getBoundingClientRect();
      const scale = gr.width / 1280;
      const cx = (cr.left + cr.width/2 - gr.left) / scale;
      const top = (cr.top - gr.top) / scale;
      bub = document.createElement('div');
      bub.className = 'chemfact';
      bub.innerHTML = '<b>'+ico('book',12)+' Bạn có biết?</b>'+fact;
      const bx = Math.max(12 + 75, Math.min(1280 - 12 - 75, cx)); // clamp: bubble is 150 wide
      bub.style.cssText = 'left:'+Math.round(bx)+'px;top:'+Math.round(top-6)+'px;bottom:auto;transform:translate(-50%,-100%)';
      bub.style.setProperty('--arrow', 'calc(50% + '+Math.round(cx-bx)+'px)'); // arrow points at the chem
      G.appendChild(bub);
    }, 5000);
  });
  el.addEventListener('mouseleave', clear);
  el.addEventListener('pointerdown', clear);
}

/* ---- reaction engine: limiting reagent reacts fully, fractional extents allowed ---- */
const RQ = v => Math.round(v*1000)/1000; // quantize doses to 0.001 (=0.0001 mol) to kill float dust
function runReactions(){
  const mix = lab.mix, fired = [];
  const hasLiquid = () => Object.keys(mix).some(f => mix[f] > 0 && (CHEMS[f].s === 'l' || CHEMS[f].s === 'd'));
  const hasGas = () => Object.keys(mix).some(f => mix[f] > 0 && CHEMS[f].s === 'k');
  for(let pass=0; pass<5; pass++){
    const cands = REACTIONS.filter(r => {
      if(r.elec && !lab.elecOn) return false;
      if(r.heat && !lab.heaterOn) return false;
      return Object.keys(r.rg).every(f => {
        if(f === 'O2' && r.heat && lab.heaterOn && !hasGas()) return true;
        if(f === 'H2O' && !r.elec && hasLiquid()) return true; // điện phân tiêu nước thật, không coi là dư
        return (mix[f]||0) > 0;
      });
    });
    if(!cands.length) break;
    cands.sort((a,b) => (a.last||0)-(b.last||0) || tot(b.rg) - tot(a.rg)); // demanding ratio wins; last-flagged (điện phân nước) always yields
    const r = cands[0];
    const n = Math.min(...Object.keys(r.rg).map(f => {
      if(f === 'O2' && r.heat && lab.heaterOn && !hasGas()) return Infinity;
      if(f === 'H2O' && !r.elec && hasLiquid()) return Infinity;
      return mix[f]/r.rg[f];
    })); // fractional extent — limiting reagent runs out
    Object.keys(r.rg).forEach(f => {
      if(f === 'O2' && r.heat && lab.heaterOn && !hasGas()) return;
      if(f === 'H2O' && !r.elec && hasLiquid()) return;
      mix[f] = RQ(mix[f] - r.rg[f]*n);
      if(mix[f] < 0.01) delete mix[f];
    });
    let gasNote = '';
    Object.keys(r.pr).forEach(f => {
      const q = r.pr[f]*n;
      if(CHEMS[f].s === 'k'){
        spawnBubbles();
        if(r.vent && r.vent.includes(f)) gasNote += ' — '+sub(f)+' sủi ở cực dương và thoát ra!';
        else if(lab.catcher){ lab.gas[f] = RQ((lab.gas[f]||0) + q); unlockAch('gas1'); gasNote = ' — đã thu '+sub(f)+' vào bình!'; }
        else gasNote = ' — khí '+sub(f)+' bay mất!';
      } else {
        mix[f] = RQ((mix[f]||0) + q);
        if(isPrecip(f)) spawnFall(CHEMS[f].c);
      }
    });
    if(r.exo){ const b = G.querySelector('#beakerzone'); b.classList.remove('glowing'); void b.offsetWidth; b.classList.add('glowing'); }
    fired.push('<span class="rl">'+eqStr(r)+gasNote+'</span>');
  }
  if(fired.length){
    G.querySelector('#rlog').innerHTML = fired.join('<br>');
    if(!tot(lab.undissolved)) flashStirRing(); // quick fill-and-fade — same ring as stirring, but for an instant reaction
  }
  return fired.length;
}
function flashStirRing(){
  const ring = G.querySelector('#stirring-ring'); if(!ring) return;

}

function addChem(f){

  if(SLOW_DISSOLVE.includes(f)){ // settles at the bottom: no reactions, no serving until stirred in
    lab.undissolved[f] = RQ((lab.undissolved[f]||0) + dose);
    lab.dissolveTotal = RQ(lab.dissolveTotal + dose);
    G.querySelector('#rlog').innerHTML = '<span class="rl">+ ' + amt(dose) + ' ' + sub(f) + ' — ít tan! Lấy đũa thuỷ tinh khuấy cho tan.</span>';

  if(CHEMS[f].s === 'd') lab.mix.H2O = RQ((lab.mix.H2O||0) + dose); // dung dịch nào cũng mang theo nước
  if(!runReactions()) G.querySelector('#rlog').innerHTML = '<span class="rl">+ ' + amt(dose) + ' ' + sub(f) + '</span>';

function updateBeaker(){
  const mix = lab.mix, ud = lab.undissolved;
  let liq = 0, pre = 0, liqColor = '#cfe6f2', preColor = '#ddd', preMax = 0, colMax = 0;
  Object.keys(mix).forEach(f => {
    if(isPrecip(f)){ pre += mix[f]; if(mix[f] > preMax){ preMax = mix[f]; preColor = CHEMS[f].c; } }
    else {
      liq += mix[f];
      if(f !== 'H2O' && mix[f] > colMax){ colMax = mix[f]; liqColor = CHEMS[f].c; }
    }
  });
  Object.keys(ud).forEach(f => { pre += ud[f]; if(ud[f] > preMax){ preMax = ud[f]; preColor = CHEMS[f].c; } }); // undissolved settles like sediment
  const zone = G.querySelector('#beakerzone');
  const lq = G.querySelector('#bk-liquid'), men = G.querySelector('#bk-meniscus');
  const pr = G.querySelector('#bk-precip'), tex = G.querySelector('#bk-precip-tex');
  const H = liq ? Math.min(30 + liq*15, 196) : 0, y = 222 - H;
  lq.setAttribute('y', y); lq.setAttribute('height', H);
  lq.style.fill = liqColor;
  men.setAttribute('transform', 'translate(0,'+y+')');

  const PH = pre ? Math.min(7 + pre*8, 54) : 0;
  pr.setAttribute('y', 222-PH); pr.setAttribute('height', PH);

  tex.setAttribute('opacity', pre ? 1 : 0);
  const dr = G.querySelector('#bk-drops');
  if(dr) dr.setAttribute('opacity', lab.heaterOn && liq ? 1 : 0);
  // color-change swirl
  if(liq && liqColor !== lab.lastColor && lab.lastColor){
    const sw = document.createElement('div');
    sw.className = 'swirlfx'; sw.style.background = liqColor;
    zone.appendChild(sw); setTimeout(()=>sw.remove(), 950);
  }
  lab.lastColor = liq ? liqColor : '';
  // stirring progress ring: fills as undissolved solid shrinks toward 0
  const ring = G.querySelector('#stirring-ring');
  if(ring){
    ring.classList.toggle('active', lab.dissolveTotal > 0);
    if(lab.dissolveTotal > 0){
      const prog = Math.max(0, Math.min(1, 1 - tot(ud)/lab.dissolveTotal));

      }).concat(Object.keys(ud).filter(f => ud[f]>0).map(f => {
        return `<div>• ↓${sub(f)}: ${amt(ud[f]).replace(' mol', '')} <span style="font-size:10px; opacity:.65">(chưa tan)</span></div>`;
      })).join('');
      snc.innerHTML = itemsList || '<div style="opacity:.6">- cốc trống -</div>';
      const sw = G.querySelector('#sn-water');
      if(sw) sw.style.display = (mix.H2O > 0) ? 'flex' : 'none'; // water badge, bottom-right corner
    }
  }
  // carried containers status line (gas bottle + filter dish)
  const carry = G.querySelector('#carry');
  if(carry){

      const gtxt = tot(lab.gas) ? Object.keys(lab.gas).map(f=>sub(f)+' '+amt(lab.gas[f])).join(', ') : 'trống';
      parts.push('<b>Bình khí:</b> '+gtxt+(tot(lab.gas)?' <button class="mgbtn" id="bpour">đổ vào cốc</button>':''));
    }

      const stxt = tot(lab.solid) ? Object.keys(lab.solid).map(f=>sub(f)+' '+amt(lab.solid[f])).join(', ') : 'trống';
      parts.push('<b>Đĩa lọc:</b> '+stxt);
    }
    carry.innerHTML = parts.join(' &nbsp;·&nbsp; ');

/* ---- glass-rod stirring: move the rod around inside the beaker to dissolve slow solids ---- */
function stirMove(p, dist){
  if(!lab || tot(lab.undissolved) <= 0) return;
  const bz = G.querySelector('#beakerzone'); if(!bz) return;
  const gr = G.getBoundingClientRect(), s = gr.width/1280, r = bz.getBoundingClientRect();
  if(p.x < (r.left-gr.left)/s || p.x > (r.right-gr.left)/s || p.y < (r.top-gr.top)/s || p.y > (r.bottom-gr.top)/s) return;
  drag.stir = (drag.stir||0) + dist;
  if(drag.stir < 240) return; // one dissolve step per ~240px of stirring motion
  drag.stir = 0;
  dissolveStep();
}
function dissolveStep(){
  const f = Object.keys(lab.undissolved)[0];
  const take = Math.min(0.5, lab.undissolved[f]);
  lab.undissolved[f] = RQ(lab.undissolved[f] - take);
  if(lab.undissolved[f] <= 0) delete lab.undissolved[f];
  lab.mix[f] = RQ((lab.mix[f]||0) + take);
  wiggleBeaker(); SFX.pour();
  runReactions();
  if(tot(lab.undissolved) <= 0){ lab.dissolveTotal = 0; toast('Tan hết rồi — dung dịch đồng nhất!'); }
  updateBeaker(); // after the reset, so the ring deactivates in the same frame the last bit dissolves
}

function checkServe(cont, od){
  if(lab.sel === 'beaker' && tot(lab.undissolved) > 0) return 'trong cốc còn chất chưa tan kìa, khuấy đều đã chứ';
  const keys = Object.keys(cont).filter(f => cont[f] > 0);
  if(!keys.length) return 'vật đựng đang trống trơn mà';
  if(CHEMS[od.chem].s === 'k' && lab.sel !== 'gas') return 'khí thì phải giao bằng bình thu khí chứ';
  if(isPrecip(od.chem) && lab.sel !== 'solid'){
    const onlySolids = keys.length > 0 && keys.every(f => CHEMS[f].s === 'r');
    if(!onlySolids) return 'chất rắn phải lọc ra đĩa rồi mới giao chứ';
  }
  if(!(cont[od.chem] > 0)) return 'không thấy ' + (od.pname || CHEMS[od.chem].n) + ' đâu cả';
  const others = keys.filter(f => f !== od.chem && f !== 'H2O');
  if(others.length) return 'hàng bị lẫn ' + others.map(sub).join(', ');
  if(Math.abs(cont[od.chem] - od.n) > 0.01) return 'cần đúng ' + amt(od.n) + ' cơ, chỗ này ' + (cont[od.chem] > od.n ? 'nhiều quá' : 'ít quá'); // epsilon: amounts are now fractional
  const hasWater = cont['H2O'] > 0 || Object.keys(cont).some(f => cont[f] > 0 && (CHEMS[f].s === 'l' || CHEMS[f].s === 'd'));
  if(od.water && !hasWater) return 'phải pha với nước chứ, khô khốc thế này';
  return true;
}

function serve(){
  const od = lab.day.orders[lab.oi];
  const c = CUSTOMERS[od.who];
  const cont = lab.sel === 'beaker' ? lab.mix : lab.sel === 'gas' ? lab.gas : lab.solid;
  const res = checkServe(cont, od);
  const sp = G.querySelector('#speech');
  if(res === true){
    if(lab.sel === 'beaker') lab.mix = {}; else if(lab.sel === 'gas') lab.gas = {}; else lab.solid = {};
    lab.served++;
    G.querySelector('#ordn').textContent = lab.served;
    sp.innerHTML = PRAISE[Math.floor(Math.random()*PRAISE.length)].replace(/\{A\}/g, c[2]);
    setExp('happy');

    SFX.coin(); setTimeout(SFX.clink, 150);
    updateBeaker();
    lab.oi++;
    if(lab.day.free) lab.day.orders.push(lab.day.freeOrder()); // endless queue: refill one per serve
    if(lab.oi >= lab.day.orders.length){ setTimeout(finishLab, 900); }
    else setTimeout(nextCustomer, 1100);
  } else {
    lab.wrong++;
    unlockAch('oops');
    sp.innerHTML = COMPLAIN[Math.floor(Math.random()*COMPLAIN.length)].replace(/\{A\}/g, c[2]).replace('{r}', res + '!');

    [cu, nt].forEach(el => { el.classList.remove('shaken'); void el.offsetWidth; el.classList.add('shaken'); });
    setTimeout(()=>setExp('neutral'), 1800);
  }
}

  mgFrame(i, day, `<p style="font-size:16px">Kéo từng thẻ vào giỏ đúng loại (hoặc bấm chọn thẻ rồi bấm giỏ).</p>
    <div class="mgcards">${cards}</div><div class="bins">${bins}</div>`);
  let sel = null, correct = 0, done = 0;
  const missed = {};
  mgScore(0, items.length);
  function grade(cardEl, binIdx){

      missed[it[0]] = 1;

    onDrop: z => grade(c, +z.slice(3)),
    onClick: () => { G.querySelectorAll('.mgcard').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); sel = c; SFX.clink(); }
  }));
  G.querySelectorAll('.bin').forEach(b => b.onclick = () => { if(sel) grade(sel, +b.dataset.b); });

/* =====================  CHẾ ĐỘ KHÓ: PHA NỒNG ĐỘ (Cₘ & C%)  ===================== */
// Dạy nồng độ mol (Cₘ) và nồng độ phần trăm (C%): dùng CÂN để đong khối lượng chất rắn,
// ỐNG ĐONG để đong thể tích nước / dung dịch gốc. Giao hàng đạt khi mọi số liệu lệch ≤ 5%.
const CONC_TOL = 0.05;                       // sai số tối đa 5%
const within = (v, t) => t > 0 && Math.abs(v - t) <= CONC_TOL * t;
// khối lượng mol tính từ công thức (bảng nguyên tử khối KHTN 8)
const ATOM = {H:1,C:12,N:14,O:16,Na:23,Mg:24,Al:27,P:31,S:32,Cl:35.5,K:39,Ca:40,Fe:56,Cu:64,Zn:65,Ag:108,Ba:137};
function molarMass(f){
  let i = 0;
  const grp = () => {
    let s = 0;
    while(i < f.length){
      const ch = f[i];
      if(ch === '('){ i++; const inner = grp(); let d = ''; while(/\d/.test(f[i]||'')) d += f[i++]; s += inner*(+d||1); }
      else if(ch === ')'){ i++; return s; }
      else if(/[A-Z]/.test(ch)){ let sy = ch; i++; while(/[a-z]/.test(f[i]||'')) sy += f[i++]; let d = ''; while(/\d/.test(f[i]||'')) d += f[i++]; s += ATOM[sy]*(+d||1); }
      else i++;
    }
    return s;
  };
  return grp();
}
const fmt = (n, d) => (+n.toFixed(d==null?1:d)).toString().replace('.', ',');
const niceCeil = x => { const p = Math.pow(10, Math.floor(Math.log10(x))); const h = p/2; return Math.max(h, Math.ceil(x/h)*h); };
const pick = a => a[Math.floor(Math.random()*a.length)];
const CONC_SOLUTES = ['NaCl','KCl','CuSO4','Na2CO3','NaNO3','C12H22O11']; // chất rắn tan, Mr đẹp

function makeChallenge(){
  for(let tries=0; tries<80; tries++){
    const who = Math.floor(Math.random()*CUSTOMERS.length);
    const kind = pick(['cm_solid','cm_dilute','cpct']);
    const sol = pick(CONC_SOLUTES), Mr = molarMass(sol), nm = CHEMS[sol].n.toLowerCase(), col = CHEMS[sol].c;
    const base = {who, sol, solColor:col};
    if(kind === 'cm_solid'){
      const V = pick([100,150,200,250]), M = pick([0.5,1,2]);
      const n = M*V/1000, mass = n*Mr;
      if(mass > 110) continue;
      return Object.assign(base, {
        order:`Pha ${V} ml dung dịch ${nm} ${fmt(M,2)}M.`,
        hint:`M(${sub(sol)}) = ${fmt(Mr,1)} g/mol · Cₘ = n / V(lít) · n = m / M`,
        aLabel:'Cân (chất tan)', aUnit:'g', aStep:0.1, aMax:niceCeil(mass*2.2), aTarget:mass,
        bUnit:'ml', bMax:niceCeil(V*1.7), bTarget:V,
        totalMode:'b', totalTarget:V, targetC:M, cUnit:'M',
        reveal:(a,b) => b>0 ? (a/Mr)/(b/1000) : 0,
        solve:`n = Cₘ·V = ${fmt(M,2)}·${fmt(V/1000,3)} = ${fmt(n,3)} mol → m = n·M = ${fmt(n,3)}·${fmt(Mr,1)} = <b>${fmt(mass,1)} g</b>; đong <b>${V} ml</b> nước.`
      });
    }
    if(kind === 'cm_dilute'){
      const stockM = pick([1,2]);
      const M = pick([0.25,0.5,1].filter(x => x < stockM));
      const V = pick([100,200,300]);
      const Vs = M*V/stockM, w = V - Vs;
      if(Vs < 10 || w < 10) continue;
      return Object.assign(base, {
        order:`Pha ${V} ml dung dịch ${nm} ${fmt(M,2)}M từ dung dịch gốc ${stockM}M.`,
        hint:`Pha loãng: C₁·V₁ = C₂·V₂ (số mol không đổi), rồi thêm nước cho đủ ${V} ml.`,
        aLabel:`Dung dịch gốc ${stockM}M`, aUnit:'ml', aStep:1, aMax:niceCeil(Vs*2.2), aTarget:Vs,
        bUnit:'ml', bMax:niceCeil(w*1.9), bTarget:w,
        totalMode:'sum', totalTarget:V, targetC:M, cUnit:'M',
        reveal:(a,b) => (a+b)>0 ? stockM*a/(a+b) : 0,
        solve:`V₁ = C₂·V₂ / C₁ = ${fmt(M,2)}·${V} / ${stockM} = <b>${fmt(Vs,1)} ml</b> dung dịch gốc; thêm <b>${fmt(w,1)} ml</b> nước cho đủ ${V} ml.`
      });
    }
    // cpct: nồng độ phần trăm
    const mdd = pick([100,150,200]), P = pick([5,10,15,20]);
    const mct = P*mdd/100, w = mdd - mct;
    if(mct > 110) continue;
    return Object.assign(base, {
      order:`Pha ${mdd} g dung dịch ${nm} ${P}%.`,
      hint:`C% = m(chất tan) / m(dung dịch) × 100 · m(nước) = m(dd) − m(chất tan) · 1 ml nước ≈ 1 g`,
      aLabel:'Cân (chất tan)', aUnit:'g', aStep:0.1, aMax:niceCeil(mct*2.4), aTarget:mct,
      bUnit:'ml', bMax:niceCeil(w*1.6), bTarget:w,
      totalMode:'sum', totalTarget:mdd, targetC:P, cUnit:'%',
      reveal:(a,b) => (a+b)>0 ? a/(a+b)*100 : 0,
      solve:`m(chất tan) = C%·m(dd)/100 = ${P}·${mdd}/100 = <b>${fmt(mct,1)} g</b>; m(nước) = ${mdd} − ${fmt(mct,1)} = <b>${fmt(w,1)} g</b>.`
    });
  }
  return null;
}

}
function serveConc(){
  const c = conc.list[conc.ci];
  const total = c.totalMode === 'b' ? conc.b : conc.a + conc.b;
  const okA = within(conc.a, c.aTarget), okT = within(total, c.totalTarget);
  const pass = okA && okT;
  if(pass){ conc.correct++; G.querySelector('#ccor').textContent = conc.correct; SFX.coin(); setTimeout(SFX.clink,150); }
  else SFX.err();
  const achieved = c.reveal(conc.a, conc.b);
  const last = conc.ci >= conc.list.length - 1;
  const chk = ok => ico(ok ? 'check' : 'close', 15);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" style="max-width:560px">
    <h2>${ico(pass?'check':'close',22)} ${pass?'Chuẩn! Sai số trong 5%':'Chưa đạt — lệch quá 5%'}</h2>
    <div style="text-align:left;font-size:15px;line-height:1.7">
      <div>${chk(okA)} ${c.aLabel}: <b>${fmt(conc.a, c.aStep<1?1:0)} ${c.aUnit}</b> · cần ${fmt(c.aTarget,1)} ${c.aUnit}</div>
      <div>${chk(okT)} Tổng ${c.totalMode==='b'?'thể tích':'khối lượng'}: <b>${fmt(total,1)}</b> · cần ${fmt(c.totalTarget,1)}</div>
      <div style="margin-top:6px">Nồng độ đạt được: <b>${fmt(achieved,2)} ${c.cUnit}</b> · yêu cầu <b>${fmt(c.targetC,2)} ${c.cUnit}</b></div>
      <div style="margin-top:8px;padding-top:8px;border-top:2px dashed var(--ink)"><b>Cách tính:</b><br>${c.solve}</div>
    </div>
    <div class="center" style="margin-top:12px"><button class="btn big" id="cnext">${last?'Xem kết quả':'Câu tiếp '+ico('next')}</button></div>
  </div>`;
  G.appendChild(ov);
  ov.querySelector('#cnext').onclick = () => { ov.remove(); if(last) go(concResult); else { conc.ci++; renderConc(); } };
}
function concResult(){
  const n = conc.list.length, cor = conc.correct, r = cor/n;
  const stars = r>=1 ? 3 : r>=.75 ? 2 : r>=.5 ? 1 : 0;
  if(cor > (save.hardBest||0)){ save.hardBest = cor; persist(); }
  const stamps = [0,1,2].map(k => '<span class="starstamp '+(k<stars?'go':'off')+'">'+ico('star',60)+'</span>').join('');
  G.innerHTML = `<div class="scene center" style="padding-top:50px">
    <h2>Kết thúc chế độ khó</h2>
    <div class="stamprow">${stamps}</div>
    <div class="paper" style="max-width:520px;margin:10px auto">
      <p style="font-size:18px">Đúng <b>${cor}/${n}</b> câu · Kỷ lục: <b>${Math.max(cor, save.hardBest||0)}/${n}</b></p>
      <div class="row" style="justify-content:center"><div id="cresprof"></div>
      <p class="hand" style="text-align:left">“${stars===3?'Bậc thầy nồng độ — không lệch một li!':stars>=1?'Khá lắm! Luyện thêm cho chắc công thức nhé.':'Ôn lại Cₘ và C% rồi thử lại nào, trò làm được mà!'}”</p></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn" id="cagain">${ico('retry')} Chơi lại</button>
      <button class="btn big" id="cmenu">${ico('map')} Về menu</button>
    </div></div>`;
  G.querySelector('#cresprof').innerHTML = profSVG(stars>=2?'happy':stars>=1?'neutral':'annoy').replace('viewBox','height="120" viewBox');
  G.querySelector('#cagain').onclick = () => go(startConc);
  G.querySelector('#cmenu').onclick = () => go(showMenu);
  if(stars > 0) SFX.bell();
}

/* =====================  SELF-CHECK & BOOT  ===================== */
// ponytail: dev-time sanity check — every order must be reachable from that day's shelf
if(DEBUG){
  console.assert(DAYS.length === 31, 'DAYS phải đủ 31 ngày');
  DAYS.forEach((day, i) => {
    if(day.mg) return;
    const have = new Set(day.chems);
    dayReactions(day).forEach(r => Object.keys(r.pr).forEach(f => have.add(f)));
    day.orders.forEach(od => {
      console.assert(CHEMS[od.chem], 'Ngày '+(i+1)+': chất lạ '+od.chem);
      console.assert(have.has(od.chem), 'Ngày '+(i+1)+': đơn '+od.chem+' KHÔNG điều chế được!');
      if(CHEMS[od.chem] && CHEMS[od.chem].s === 'k') console.assert(day.tools.includes('gas'), 'Ngày '+(i+1)+': cần bình thu khí cho '+od.chem);
      if(CHEMS[od.chem] && isPrecip(od.chem)) console.assert(day.tools.includes('filter'), 'Ngày '+(i+1)+': cần phễu lọc cho '+od.chem);
    });
  });
  REACTIONS.forEach((r,k) => {
    Object.keys(r.rg).concat(Object.keys(r.pr)).forEach(f => console.assert(CHEMS[f], 'Phản ứng #'+k+': chất lạ '+f));
  });
  // hard mode: molar mass parser + tolerance + generated challenges are self-consistent
  console.assert(molarMass('NaCl') === 58.5, 'Mr NaCl');
  console.assert(molarMass('Ca(OH)2') === 74, 'Mr Ca(OH)2');
  console.assert(molarMass('CuSO4') === 160, 'Mr CuSO4');
  console.assert(molarMass('C12H22O11') === 342, 'Mr saccarozơ');
  console.assert(molarMass('Cu(NO3)2') === 188, 'Mr Cu(NO3)2 (dấu ngoặc)');
  console.assert(within(104.9,100) && !within(106,100), 'ngưỡng 5%');
  for(let t=0; t<300; t++){
    const c = makeChallenge();
    console.assert(c, 'makeChallenge trả null');
    if(!c) continue;
    const total = c.totalMode === 'b' ? c.bTarget : c.aTarget + c.bTarget;
    // đáp án đúng phải qua; lệch 6% ở một số liệu phải trượt
    console.assert(within(c.aTarget,c.aTarget) && within(total,c.totalTarget), 'đáp án đúng lại trượt');
    console.assert(!within(c.aTarget*1.06, c.aTarget), '+6% vẫn qua?!');
    console.assert(c.aTarget<=c.aMax && c.bTarget<=c.bMax, 'mục tiêu vượt thang trượt');
    console.assert(Math.abs(c.reveal(c.aTarget,c.bTarget) - c.targetC) < c.targetC*0.02, 'nồng độ đạt ≠ yêu cầu');
  }
}
document.body.insertAdjacentHTML('afterbegin',
  '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' + SVG_DEFS + '</defs></svg>');
fit();
showMenu();
</script>
